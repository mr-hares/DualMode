prefix: "#ffb433(DualMode) &r"

help:
  commands:
    - "&f"
    - " #ffb433/dualmode (/dm) reload &7- &fОбновить настройки плагина"
    - " #ffb433/dualmode (/dm) change &7- &fИзменить игровой режим игрока"
    - " #ffb433/dualmode (/dm) stats &7- &fПосмотреть сводку по режимам"
    - "&f"

  use-change: "{prefix}Пример: #ffb433/dualmode (/dm) change <игрок> <PVP/PVE>"

menu:
  choose:
    pve:
      name: "&aРежим PVE"
      lore:
        - "&f"
        - " &fТы не любишь драки и хаос."
        - " &fТвой путь — строить, творить"
        - " &fи наслаждаться спокойной игрой."
        - ""
        - " #ffb433Ключевая особенность"
        - "  &7- &fДругие игроки не могут нанести тебе урон"
        - "&f"

    pvp:
      name: "&cРежим PVP"
      lore:
        - "&f"
        - " &fТы всегда в центре событий."
        - " &fТвои боевые навыки — твоя сила."
        - ""
        - " #ffb433Ключевая особенность"
        - "  &7- &fТы можешь атаковать любого игрока"
        - "    &8Кроме тех, кто в режиме PVE"

reload: "{prefix}Конфигурация успешно перезагружена"
only-player: "{prefix}Эта команда доступна только игрокам"
not-permission: "{prefix}У тебя нет прав на выполнение этой команды"
waiting-cooldown: "{prefix}Смена режима пока недоступна. Жди #ffb433{time}"
in-combat: "{prefix}В бою нельзя менять режим"

choose-mode:
  message: "{prefix}Ты активировал режим {mode}"

  pvp:
    title: "&cРежим PVP"
    subtitle: "&7Покажи, на что ты способен в бою"

  pve:
    title: "&aРежим PVE"
    subtitle: "&7Строй, выживай и общайся без лишних драк"

warnings:
  actionbar:
    for-pve: "&cТы не можешь атаковать других игроков"
    for-pvp: "&cИгроки в PVE-режиме неуязвимы для тебя"

change:
  not-found-player: "{prefix}Игрок с таким ником не найден"

  message: "{prefix}Ты перевёл игрока #ffb433{player} &fв режим {mode}"
  player-notify: "{prefix}Админ #ffb433{player} &fизменил твой режим на {mode}"

stats:
  - "{prefix}Сводка по режимам"
  - "  &fВсего выборов: #ffb433{total}"
  - "  &fPVE-режим: &a{pve}"
  - "  &fPVP-режим: &c{pvp}"
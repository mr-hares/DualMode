name: DualMode
version: '1.0-alpha'
main: ru.mr_hares.dualmode.DualMode
api-version: '1.21'
authors: [ mr_hares ]
folia-supported: true

commands:
  dualmode:
    aliases: [dm]
    permission: dualmode.admin.change;dualmode.admin.reload;dualmode.admin.stats;
  mode:
    permission: default

permissions:
  dualmode.*:
    description: "Все разрешения плагина"
    default: op
    children:
      - dualmode.admin.*
      - dualmode.bypass.*

  dualmode.admin.*:
    description: "Все админские разрешения плагина"
    default: op
    children:
      - dualmode.admin.change
      - dualmode.admin.stats
      - dualmode.admin.reload

  dualmode.bypass.*:
    description: "Все права на игнорирование ограничений"
    default: op
    children:
      - dualmode.bypass.cooldown
      - dualmode.bypass.combat

  dualmode.admin.change:
    description: "Разрешение на изменение режима игрока"
    default: op

  dualmode.admin.reload:
    description: "Разрешение на перезагрузку конфигурации"
    default: op

  dualmode.admin.stats:
    description: "Разрешение на просмотр сводки по режимам"
    default: op

  dualmode.bypass.cooldown:
    description: "Игнорирует задержку между сменами режима"
    default: op

  dualmode.bypass.combat:
    description: "Позволяет менять режим во время PVP-боя"
    default: op